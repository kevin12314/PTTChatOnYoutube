<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>PTTChatOnYoutube Local Test</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: sans-serif;
      background: #f5f5f5;
    }

    #smoke-root {
      min-height: 900px;
    }
  </style>
  <script>
    (function () {
      const store = new Map()
      window.GM_getValue = function (key, defaultValue) {
        return store.has(key) ? store.get(key) : defaultValue
      }
      window.GM_setValue = function (key, value) {
        store.set(key, value)
        return value
      }
      window.GM_deleteValue = function (key) {
        store.delete(key)
      }
      window.GM_addValueChangeListener = function () {
        return 1
      }
      window.GM_removeValueChangeListener = function () {}
      window.GM_registerMenuCommand = function () {
        return 1
      }
      window.GM_unregisterMenuCommand = function () {}
      window.GM_info = { script: { version: '4.1.4' } }
      window.unsafeWindow = window
    })()
  </script>
</head>

<body>
  <div id="smoke-root"></div>
  <script>
    (function loadBundleWhenBodyReady () {
      function injectBundle () {
        if (!document.body || document.querySelector('script[data-local-dev-bundle]')) return

        const script = document.createElement('script')
        script.src = '/main.user.js'
        script.dataset.localDevBundle = 'true'
        document.body.appendChild(script)
      }

      if (document.body) {
        injectBundle()
        return
      }

      document.addEventListener('DOMContentLoaded', injectBundle, { once: true })
    })()
  </script>
</body>

</html>
